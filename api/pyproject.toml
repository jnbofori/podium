[project]
name = "podium-api"
version = "0.1.0"
description = "Podium FastAPI backend — auth, decks, sessions, LiveKit tokens"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30.0",
  "pydantic-settings>=2.6.0",
  "email-validator>=2.2.0",
  "python-multipart>=0.0.17",
  "passlib[bcrypt]>=1.7.4",
  "bcrypt>=4.0.0,<4.1.0",
  "PyJWT>=2.9.0",
  "httpx>=0.28.0",
  "supabase>=2.10.0",
  "livekit-api>=0.8.0",
  "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.8.0",
  "httpx>=0.28.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
